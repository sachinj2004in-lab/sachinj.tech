<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="safetyBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E1418" />
      <stop offset="55%" stop-color="#0F0A0D" />
      <stop offset="100%" stop-color="#040203" />
    </radialGradient>

    <filter id="sosGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="gpsPatch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#safetyBg)" />

  <!-- Ambient Pulsating Emergency Red Spotlight -->
  <circle cx="960" cy="520" r="380" fill="#FF1F1F" opacity="0.14" filter="url(#sosGlow)" />

  <!-- ============================================ -->
  <!-- 1. AUTOMOTIVE CRASH SAFETY HARDWARE RIG      -->
  <!-- ============================================ -->
  <g transform="translate(180, 220)">
    <!-- Rugged Automotive Junction Enclosure -->
    <rect x="0" y="0" width="1560" height="640" rx="28" fill="#11131A" stroke="#FF1F1F" stroke-width="2.5" filter="url(#sosGlow)" />
    <rect x="18" y="18" width="1524" height="604" rx="20" fill="#0A0B10" />

    <!-- ============================================ -->
    <!-- 2. LEFT: ADXL345 3-AXIS ACCELEROMETER MODULE -->
    <!-- ============================================ -->
    <g transform="translate(240, 280)">
      <!-- PCB Substrate (Blue) -->
      <rect x="-140" y="-140" width="280" height="280" rx="16" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2" />
      
      <!-- ADXL345 MEMS Accelerometer IC Body -->
      <rect x="-45" y="-45" width="90" height="90" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
      <circle cx="-30" cy="-30" r="4" fill="#3B82F6" />
      <text x="0" y="-5" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ADXL345</text>
      <text x="0" y="15" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">±16g MEMS</text>

      <!-- 3-Axis Coordinate Arrows (X, Y, Z) -->
      <!-- X-Axis -->
      <line x1="45" y1="0" x2="105" y2="0" stroke="#EF4444" stroke-width="3" />
      <polygon points="105,-6 117,0 105,6" fill="#EF4444" />
      <text x="126" y="5" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">+X</text>

      <!-- Y-Axis -->
      <line x1="0" y1="-45" x2="0" y2="-105" stroke="#10B981" stroke-width="3" />
      <polygon points="-6,-105 0,-117 6,-105" fill="#10B981" />
      <text x="0" y="-124" text-anchor="middle" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">+Y</text>

      <!-- Z-Axis -->
      <circle cx="-25" cy="25" r="8" fill="#F59E0B" />
      <text x="-25" y="29" text-anchor="middle" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">•</text>
      <text x="-48" y="29" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">+Z</text>

      <!-- Impact Value Badge -->
      <rect x="-120" y="80" width="240" height="40" rx="8" fill="#991B1B" stroke="#FF1F1F" stroke-width="1.5" filter="url(#sosGlow)" />
      <text x="0" y="105" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">IMPACT: 4.82G [TRIGGERED]</text>
    </g>

    <!-- ============================================ -->
    <!-- 3. CENTER: NEO-6M CERAMIC GPS RECEIVER       -->
    <!-- ============================================ -->
    <g transform="translate(680, 280)">
      <!-- GPS Module Board -->
      <rect x="-140" y="-140" width="280" height="280" rx="16" fill="#042F2E" stroke="#10B981" stroke-width="2" />
      
      <!-- Ceramic Patch Antenna (Square Gold Element) -->
      <rect x="-95" y="-95" width="190" height="190" rx="10" fill="url(#gpsPatch)" stroke="#78350F" stroke-width="2" filter="url(#sosGlow)" />
      <!-- Silver Feed Pin in Center of Patch -->
      <circle cx="0" cy="0" r="7" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" />

      <!-- GPS Satellite Lock LED (Flashing Green) -->
      <circle cx="-110" cy="110" r="7" fill="#10B981" filter="url(#sosGlow)" />
      <text x="-95" y="114" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">3D LOCK (9 SATS)</text>

      <text x="0" y="125" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">u-blox NEO-6M GPS</text>
    </g>

    <!-- ============================================ -->
    <!-- 4. RIGHT: SIM800L GSM CELLULAR SOS SYSTEM    -->
    <!-- ============================================ -->
    <g transform="translate(1120, 150)">
      <!-- Cellular Shield PCB (Red) -->
      <rect x="0" y="0" width="380" height="180" rx="14" fill="#881337" stroke="#FF1F1F" stroke-width="2" />
      
      <!-- SIM800L Metal RF Can -->
      <rect x="25" y="25" width="220" height="130" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
      <text x="135" y="65" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">SIM800L GSM/GPRS</text>
      <text x="135" y="88" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">QUAD-BAND 850/900/1800/1900</text>
      <text x="135" y="108" text-anchor="middle" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="10">AUTOMATIC SMS DISPATCH</text>

      <!-- Helical Wire Spring Antenna on Right -->
      <g transform="translate(290, 40)" stroke="#FF1F1F" stroke-width="3" fill="none" filter="url(#sosGlow)">
        <path d="M 0,0 Q 15,10 0,20 Q 15,30 0,40 Q 15,50 0,60 Q 15,70 0,80 L 0,110" />
      </g>
    </g>

    <!-- Automated Emergency Dispatch Transmission Card -->
    <g transform="translate(1120, 360)">
      <rect x="0" y="0" width="380" height="220" rx="16" fill="#0A0B10" stroke="#FF1F1F" stroke-width="2" filter="url(#sosGlow)" />
      
      <circle cx="28" cy="28" r="8" fill="#FF1F1F" filter="url(#sosGlow)" />
      <text x="48" y="33" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" letter-spacing="2">AUTOMATED SOS OUTBOUND</text>

      <rect x="20" y="55" width="340" height="145" rx="10" fill="#16080A" stroke="#991B1B" />
      <text x="32" y="78" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">RECIPIENTS: 112 &amp; FAMILY CONTACT</text>
      <text x="32" y="102" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11">"ALERT! Vehicle collision detected."</text>
      <text x="32" y="122" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">Lat: 11.0168° N · Long: 76.9558° E</text>
      <text x="32" y="142" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">Location: Coimbatore Bypass Rd</text>
      
      <rect x="32" y="158" width="180" height="22" rx="11" fill="#10B981" />
      <text x="122" y="173" text-anchor="middle" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">SMS SENT // CELL TOWER ACK</text>
    </g>
  </g>

  <!-- Top Watermark -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="4">SACHIN J // PROJECT 12</text>
    <text x="0" y="32" fill="#FFFFFF" font-family="'Anton', sans-serif" font-size="36" letter-spacing="2">CAR ACCIDENT SAFETY MONITOR</text>
    <text x="0" y="58" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">ADXL345 3-AXIS G-FORCE SENSOR · NEO-6M GPS SATELLITE TRACKER · SIM800L GSM AUTOMATED SOS</text>
  </g>
</svg>
