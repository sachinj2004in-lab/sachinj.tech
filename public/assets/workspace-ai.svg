<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="deskBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#151A26" />
      <stop offset="50%" stop-color="#0B0E15" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>

    <!-- Glowing filters -->
    <filter id="redDeskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <!-- Monitor gradient -->
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A101C" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Brushed Aluminum Surface -->
    <linearGradient id="metalDesk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2638" />
      <stop offset="50%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
  </defs>

  <!-- Deep Studio Canvas -->
  <rect width="1920" height="1080" fill="url(#deskBg)" />

  <!-- Ambient Red Desk Underglow -->
  <ellipse cx="960" cy="740" rx="750" ry="120" fill="#FF1F1F" opacity="0.18" filter="url(#redDeskGlow)" />

  <!-- Perspective Studio Back Wall Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" /><line x1="300" y1="0" x2="300" y2="600" /><line x1="500" y1="0" x2="500" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" /><line x1="900" y1="0" x2="900" y2="600" /><line x1="1100" y1="0" x2="1100" y2="600" />
    <line x1="1300" y1="0" x2="1300" y2="600" /><line x1="1500" y1="0" x2="1500" y2="600" /><line x1="1700" y1="0" x2="1700" y2="600" />
    <line x1="0" y1="200" x2="1920" y2="200" /><line x1="0" y1="400" x2="1920" y2="400" />
  </g>

  <!-- ============================================ -->
  <!-- 1. DUAL CURVED ULTRAWIDE MONITORS            -->
  <!-- ============================================ -->
  <g transform="translate(960, 360)">
    <!-- Monitor Mount Arm -->
    <rect x="-25" y="160" width="50" height="180" rx="8" fill="#1A202C" stroke="#2D3748" stroke-width="2" />
    <ellipse cx="0" cy="340" rx="90" ry="25" fill="#171923" stroke="#4A5568" stroke-width="2" />

    <!-- Left Ultrawide Curved Screen -->
    <g transform="translate(-460, 0) rotate(5)">
      <!-- Monitor Frame -->
      <rect x="-420" y="-220" width="840" height="440" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="4" filter="url(#screenGlow)" />
      <!-- Display Panel -->
      <rect x="-405" y="-205" width="810" height="410" rx="10" fill="url(#monitorGrad)" />
      
      <!-- Screen Header Bar -->
      <rect x="-405" y="-205" width="810" height="32" fill="#161B22" />
      <circle cx="-385" cy="-189" r="5" fill="#FF5F56" />
      <circle cx="-368" cy="-189" r="5" fill="#FFBD2E" />
      <circle cx="-351" cy="-189" r="5" fill="#27C93F" />
      <text x="-320" y="-184" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">workspace_automation.cpp — FreeRTOS Core 0</text>

      <!-- Code Lines Visuals -->
      <g transform="translate(-385, -150)" font-family="'JetBrains Mono', monospace" font-size="11">
        <text x="0" y="0" fill="#FF7B72">#include &lt;esp_now.h&gt;</text>
        <text x="0" y="22" fill="#FF7B72">#include &lt;driver/ledc.h&gt;</text>
        <text x="0" y="44" fill="#79C0FF">void <tspan fill="#D2A8FF">setup_desk_actuators</tspan>() {</text>
        <text x="24" y="66" fill="#FFA657">  ledcSetup(PWM_CH0, 20000, 10);</text>
        <text x="24" y="88" fill="#FFA657">  ledcAttachPin(MOTOR_PIN_UP, PWM_CH0);</text>
        <text x="24" y="110" fill="#7EE787">  Serial.println("[DESK] Linear Actuator Calibrated: 104cm");</text>
        <text x="0" y="132" fill="#79C0FF">}</text>
        <text x="0" y="160" fill="#79C0FF">void <tspan fill="#D2A8FF">loop_voice_events</tspan>() {</text>
        <text x="24" y="182" fill="#FFA657">  if (voiceTrigger == "SIT_STAND_MODE") {</text>
        <text x="48" y="204" fill="#38BDF8">    smoothTransitionHeight(TARGET_STAND);</text>
        <text x="24" y="226" fill="#FFA657">  }</text>
        <text x="0" y="248" fill="#79C0FF">}</text>
      </g>
    </g>

    <!-- Right Ultrawide Curved Screen -->
    <g transform="translate(460, 0) rotate(-5)">
      <!-- Monitor Frame -->
      <rect x="-420" y="-220" width="840" height="440" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="4" filter="url(#screenGlow)" />
      <!-- Display Panel -->
      <rect x="-405" y="-205" width="810" height="410" rx="10" fill="url(#monitorGrad)" />

      <!-- Screen Header Bar -->
      <rect x="-405" y="-205" width="810" height="32" fill="#161B22" />
      <text x="-385" y="-184" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TELEMETRY &amp; HARDWARE SENSOR MONITOR</text>

      <!-- Live Oscilloscope & Audio Waveform on Screen -->
      <g transform="translate(-385, -140)">
        <rect x="0" y="0" width="770" height="130" rx="8" fill="#06090F" stroke="#21262D" stroke-width="1.5" />
        <!-- Grid lines in oscilloscope -->
        <line x1="0" y1="65" x2="770" y2="65" stroke="#161B22" stroke-width="1" />
        <line x1="190" y1="0" x2="190" y2="130" stroke="#161B22" stroke-width="1" />
        <line x1="385" y1="0" x2="385" y2="130" stroke="#161B22" stroke-width="1" />
        <line x1="580" y1="0" x2="580" y2="130" stroke="#161B22" stroke-width="1" />
        <!-- Green Oscilloscope Wave -->
        <path d="M 0,65 Q 40,20 80,65 T 160,65 T 240,110 T 320,65 T 400,10 T 480,65 T 560,90 T 640,65 T 720,30 L 770,65" 
              fill="none" stroke="#27C93F" stroke-width="2.5" />
        <!-- Red Telemetry Wave -->
        <path d="M 0,65 Q 50,85 100,65 T 200,45 T 300,95 T 400,65 T 500,30 T 600,65 T 700,75 L 770,65" 
              fill="none" stroke="#FF1F1F" stroke-width="2" opacity="0.8" />
        <text x="15" y="24" fill="#27C93F" font-family="'JetBrains Mono', monospace" font-size="10">PWM MOTOR TORQUE: 3.4 Nm</text>
        <text x="240" y="24" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="10">VOICE MIC ARRAY: 48 kHz ACTIVE</text>
      </g>

      <!-- 3 IoT Widget Boxes -->
      <g transform="translate(-385, 20)">
        <!-- Box 1 -->
        <rect x="0" y="0" width="245" height="150" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <text x="16" y="26" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="10">DESK ELEVATION</text>
        <text x="16" y="65" fill="#FFFFFF" font-family="'Anton', sans-serif" font-size="32">104 CM</text>
        <text x="16" y="92" fill="#27C93F" font-family="'JetBrains Mono', monospace" font-size="10">STATUS: STANDING PRESET</text>
        <rect x="16" y="110" width="210" height="6" rx="3" fill="#21262D" />
        <rect x="16" y="110" width="160" height="6" rx="3" fill="#38BDF8" />

        <!-- Box 2 -->
        <rect x="260" y="0" width="245" height="150" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <text x="276" y="26" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="10">AMBIENT LUX &amp; TEMP</text>
        <text x="276" y="65" fill="#FF1F1F" font-family="'Anton', sans-serif" font-size="32">420 LUX</text>
        <text x="276" y="92" fill="#FFA657" font-family="'JetBrains Mono', monospace" font-size="10">TEMP: 23.8°C · RH: 48%</text>

        <!-- Box 3 -->
        <rect x="520" y="0" width="250" height="150" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <text x="536" y="26" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="10">ESP32 WORKSPACE NODE</text>
        <text x="536" y="65" fill="#38BDF8" font-family="'Anton', sans-serif" font-size="28">ONLINE</text>
        <text x="536" y="92" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="10">Wi-Fi: 192.168.1.144</text>
      </g>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- 2. HIGH-TECH WORKBENCH DESK SURFACE          -->
  <!-- ============================================ -->
  <g transform="translate(0, 680)">
    <!-- Desktop Chamfer Edge -->
    <polygon points="0,0 1920,0 1920,400 0,400" fill="url(#metalDesk)" />
    <!-- Bevel highlight line -->
    <line x1="0" y1="0" x2="1920" y2="0" stroke="#4A5568" stroke-width="3" />
    <line x1="0" y1="8" x2="1920" y2="8" stroke="#FF1F1F" stroke-width="3" opacity="0.8" filter="url(#redDeskGlow)" />

    <!-- Center Engineering Console Box (Custom ESP32 Controller) -->
    <g transform="translate(960, 140)">
      <!-- Console Base Housing -->
      <rect x="-240" y="-90" width="480" height="180" rx="18" fill="#111622" stroke="#2D3748" stroke-width="2.5" />
      <rect x="-225" y="-75" width="450" height="150" rx="12" fill="#0B0F17" stroke="#FF1F1F" stroke-width="1.5" stroke-opacity="0.6" />

      <!-- Left: Mini OLED Screen -->
      <rect x="-200" y="-55" width="180" height="110" rx="8" fill="#030508" stroke="#38BDF8" stroke-width="1" />
      <text x="-190" y="-30" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ESP32 SMART HUB</text>
      <text x="-190" y="-5" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13">DESK: 104 cm</text>
      <text x="-190" y="16" fill="#27C93F" font-family="'JetBrains Mono', monospace" font-size="9">LIGHTS: SYNCED</text>
      <text x="-190" y="36" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="9">MIC: LISTENING...</text>

      <!-- Center: Rotary CNC Aluminum Encoder Knob -->
      <circle cx="50" cy="0" r="42" fill="#1A202C" stroke="#718096" stroke-width="3" />
      <circle cx="50" cy="0" r="32" fill="#2D3748" />
      <line x1="50" y1="-32" x2="50" y2="-18" stroke="#FF1F1F" stroke-width="3" stroke-linecap="round" filter="url(#redDeskGlow)" />
      <text x="50" y="60" text-anchor="middle" fill="#A0AEC0" font-family="'JetBrains Mono', monospace" font-size="10">ELEVATION</text>

      <!-- Right: Touch Controls & LED Indicator -->
      <circle cx="150" cy="-25" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <polygon points="150,-32 144,-22 156,-22" fill="#38BDF8" />
      
      <circle cx="150" cy="25" r="14" fill="#1E293B" stroke="#FF1F1F" stroke-width="1.5" />
      <polygon points="150,32 144,22 156,22" fill="#FF1F1F" />

      <circle cx="195" cy="0" r="6" fill="#10B981" filter="url(#redDeskGlow)" />
    </g>

    <!-- Left: Voice Assistant Microphone Puck -->
    <g transform="translate(420, 150)">
      <ellipse cx="0" cy="0" rx="60" ry="25" fill="#1A202C" stroke="#4A5568" stroke-width="2" />
      <ellipse cx="0" cy="-6" rx="50" ry="20" fill="#0D1117" stroke="#00F0FF" stroke-width="2.5" filter="url(#redDeskGlow)" />
      <!-- Radial mic holes pattern -->
      <circle cx="0" cy="-6" r="3" fill="#00F0FF" />
      <circle cx="-16" cy="-6" r="2" fill="#00F0FF" /><circle cx="16" cy="-6" r="2" fill="#00F0FF" />
      <circle cx="0" cy="-14" r="2" fill="#00F0FF" /><circle cx="0" cy="2" r="2" fill="#00F0FF" />
      <text x="0" y="40" text-anchor="middle" fill="#A0AEC0" font-family="'JetBrains Mono', monospace" font-size="10">FAR-FIELD MIC ARRAY</text>
    </g>

    <!-- Right: Motorized Actuator Column Silhouette -->
    <g transform="translate(1500, 110)">
      <rect x="-40" y="-40" width="80" height="240" rx="8" fill="#1A202C" stroke="#4A5568" stroke-width="2" />
      <rect x="-30" y="-30" width="60" height="70" fill="#111827" />
      <text x="0" y="10" text-anchor="middle" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">HEAVY DUTY</text>
      <text x="0" y="28" text-anchor="middle" fill="#A0AEC0" font-family="'JetBrains Mono', monospace" font-size="8">800N ACTUATOR</text>
    </g>
  </g>

  <!-- Top Watermark -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="4">SACHIN J // PROJECT 02</text>
    <text x="0" y="32" fill="#FFFFFF" font-family="'Anton', sans-serif" font-size="36" letter-spacing="2">WORKSPACE AI — SMART AUTOMATED WORKSTATION</text>
    <text x="0" y="58" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">ESP32 EMBEDDED CONTROLLER · MOTORIZED DUAL LINEAR ACTUATORS · FAR-FIELD SPEECH</text>
  </g>
</svg>
