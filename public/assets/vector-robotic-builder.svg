<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="robotBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="55%" stop-color="#0A0D15" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <filter id="robotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="armMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1F1F" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF1F1F" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#robotBg)" />

  <!-- Technical Lab Floor Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="960" y1="500" x2="0" y2="1080" /><line x1="960" y1="500" x2="480" y2="1080" />
    <line x1="960" y1="500" x2="1440" y2="1080" /><line x1="960" y1="500" x2="1920" y2="1080" />
    <ellipse cx="960" cy="850" rx="800" ry="160" fill="none" stroke-dasharray="8 8" />
  </g>

  <!-- Ambient Red Spotting -->
  <circle cx="1060" cy="520" r="280" fill="#FF1F1F" opacity="0.1" filter="url(#robotGlow)" />

  <!-- ============================================ -->
  <!-- 1. MULTI-AXIS INDUSTRIAL ROBOTIC ARM         -->
  <!-- ============================================ -->
  <g transform="translate(820, 200)">
    <!-- Base Turntable & Heavy Riser -->
    <ellipse cx="0" cy="650" rx="140" ry="45" fill="#0F172A" stroke="#475569" stroke-width="3" />
    <rect x="-80" y="520" width="160" height="130" rx="14" fill="url(#armMetal)" stroke="#38BDF8" stroke-width="2" />
    <text x="0" y="600" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">AXIS 01 // 360°</text>

    <!-- Main Shoulder Joint (Base Pivot) -->
    <circle cx="0" cy="520" r="55" fill="#1E293B" stroke="#FF1F1F" stroke-width="3" filter="url(#robotGlow)" />
    <circle cx="0" cy="520" r="30" fill="#0F172A" />

    <!-- Arm Segment 1: Bicep Beam (Inclined Up-Right) -->
    <path d="M -30,510 L 220,220 L 270,250 L 30,550 Z" fill="url(#armMetal)" stroke="#64748B" stroke-width="2" />
    <line x1="-5" y1="520" x2="245" y2="235" stroke="#FF1F1F" stroke-width="3" opacity="0.8" />

    <!-- Elbow Joint -->
    <circle cx="245" cy="235" r="48" fill="#1E293B" stroke="#00F0FF" stroke-width="3" filter="url(#robotGlow)" />
    <circle cx="245" cy="235" r="25" fill="#0F172A" />

    <!-- Arm Segment 2: Forearm Beam (Extending Down-Right toward PCB) -->
    <path d="M 230,220 L 510,480 L 480,510 L 210,250 Z" fill="url(#armMetal)" stroke="#64748B" stroke-width="2" />

    <!-- Wrist Joint -->
    <circle cx="495" cy="495" r="36" fill="#1E293B" stroke="#FF1F1F" stroke-width="3" filter="url(#robotGlow)" />

    <!-- Precision Mechanical Tool Gripper -->
    <g transform="translate(495, 495) rotate(45)">
      <rect x="-20" y="0" width="40" height="60" rx="6" fill="#334155" stroke="#94A3B8" stroke-width="2" />
      <!-- Left Claw Finger -->
      <path d="M -20,60 L -35,110 L -25,125 L -10,80 Z" fill="#64748B" stroke="#38BDF8" stroke-width="2" />
      <!-- Right Claw Finger -->
      <path d="M 20,60 L 35,110 L 25,125 L 10,80 Z" fill="#64748B" stroke="#38BDF8" stroke-width="2" />
      <!-- Held Microchip / SMD QFP IC in Gripper -->
      <rect x="-18" y="105" width="36" height="36" rx="4" fill="#090D16" stroke="#FF1F1F" stroke-width="2" filter="url(#robotGlow)" />
      <circle cx="-10" cy="113" r="2" fill="#FF1F1F" />
      <!-- Red Laser Alignment Guide Line Shooting Straight Down -->
      <line x1="0" y1="140" x2="0" y2="280" stroke="url(#laserBeam)" stroke-width="2" filter="url(#robotGlow)" />
    </g>
  </g>

  <!-- ============================================ -->
  <!-- 2. HIGH-DENSITY PRINTED CIRCUIT BOARD (PCB)  -->
  <!-- ============================================ -->
  <g transform="translate(1180, 800)">
    <!-- Circuit Board Substrate -->
    <rect x="-260" y="-80" width="520" height="190" rx="12" fill="#062816" stroke="#10B981" stroke-width="3" />
    <rect x="-245" y="-65" width="490" height="160" rx="8" fill="#041E10" />

    <!-- Copper Circuit Traces -->
    <g stroke="#34D399" stroke-width="2" fill="none" opacity="0.6">
      <path d="M -220,0 L -140,0 L -100,-40 L -20,-40" />
      <path d="M -220,40 L -160,40 L -120,70 L 40,70" />
      <path d="M 220,0 L 140,0 L 100,-40 L 40,-40" />
      <path d="M 220,40 L 160,40 L 120,70 L -40,70" />
      <circle cx="-20" cy="-40" r="4" fill="#34D399" />
      <circle cx="40" cy="-40" r="4" fill="#34D399" />
    </g>

    <!-- Placement Target Box with Reticle -->
    <rect x="-40" y="-35" width="80" height="70" rx="6" fill="none" stroke="#FF1F1F" stroke-width="2" stroke-dasharray="6 4" filter="url(#robotGlow)" />
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#FF1F1F" stroke-width="1.5" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#FF1F1F" stroke-width="1.5" />
    <text x="0" y="60" text-anchor="middle" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">PLACEMENT TARGET TOLERANCE: ±0.02 mm</text>
  </g>

  <!-- ============================================ -->
  <!-- 3. OVERHEAD COMPUTER VISION HUD & TOOL RACK  -->
  <!-- ============================================ -->
  <!-- Overhead Camera Inspection Box -->
  <g transform="translate(180, 280)">
    <rect x="0" y="0" width="360" height="200" rx="18" fill="#0A0E17" stroke="#38BDF8" stroke-width="2" opacity="0.95" />
    <circle cx="28" cy="30" r="6" fill="#10B981" />
    <text x="45" y="34" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">AI VISION FEED · 4K 120 FPS</text>
    
    <!-- Mini Camera Screen -->
    <rect x="20" y="55" width="320" height="125" rx="8" fill="#04060A" stroke="#1E293B" />
    <!-- Object Detection Box in Camera -->
    <rect x="110" y="80" width="85" height="70" fill="none" stroke="#22C55E" stroke-width="1.5" />
    <text x="110" y="75" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="9">QFP-64 IC [99.8%]</text>
    
    <text x="210" y="95" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10">COORDS: X:142.4</text>
    <text x="210" y="115" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10">Y: 284.8 Z: 12.1</text>
    <text x="210" y="135" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="10">ROTATION: 45.0°</text>
  </g>

  <!-- Automatic Tool Changer Rack on Right -->
  <g transform="translate(1520, 340)">
    <rect x="0" y="0" width="320" height="280" rx="18" fill="#0A0E17" stroke="#64748B" stroke-width="1.5" opacity="0.95" />
    <text x="24" y="36" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TOOL CHANGER RACK</text>
    
    <!-- Tool Slot 1 -->
    <rect x="20" y="55" width="280" height="60" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1" />
    <circle cx="45" cy="85" r="8" fill="#38BDF8" />
    <text x="65" y="82" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11">SLOT 01: VACUUM PICKUP</text>
    <text x="65" y="98" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9">STATUS: ACTIVE IN USE</text>

    <!-- Tool Slot 2 -->
    <rect x="20" y="125" width="280" height="60" rx="8" fill="#111827" stroke="#475569" stroke-width="1" />
    <circle cx="45" cy="155" r="8" fill="#64748B" />
    <text x="65" y="152" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">SLOT 02: MICRO-SOLDERING</text>
    <text x="65" y="168" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">STANDBY · 350°C READY</text>

    <!-- Tool Slot 3 -->
    <rect x="20" y="195" width="280" height="60" rx="8" fill="#111827" stroke="#475569" stroke-width="1" />
    <circle cx="45" cy="225" r="8" fill="#64748B" />
    <text x="65" y="222" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">SLOT 03: OPTICAL SENSOR</text>
    <text x="65" y="238" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">STANDBY CALIBRATED</text>
  </g>

  <!-- Top Watermark -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="4">SACHIN J // PROJECT 04</text>
    <text x="0" y="32" fill="#FFFFFF" font-family="'Anton', sans-serif" font-size="36" letter-spacing="2">VECTOR — AI-POWERED ROBOTIC BUILDER</text>
    <text x="0" y="58" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">MULTI-AXIS ARTICULATED ROBOTICS · COMPUTER VISION GUIDANCE · AUTO-TOOL CHANGER</text>
  </g>
</svg>
