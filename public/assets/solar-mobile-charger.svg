<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="solarBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="55%" stop-color="#0E121A" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>

    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="pvCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#solarBg)" />

  <!-- Ambient Amber & Red Solar Glow -->
  <circle cx="800" cy="520" r="380" fill="#F59E0B" opacity="0.08" filter="url(#solarGlow)" />
  <circle cx="1350" cy="520" r="280" fill="#FF1F1F" opacity="0.1" filter="url(#solarGlow)" />

  <!-- ============================================ -->
  <!-- 1. LEFT: MONOCRYSTALLINE SOLAR PANEL MATRIX  -->
  <!-- ============================================ -->
  <g transform="translate(240, 260)">
    <!-- Heavy Duty Weatherproof Anodized Frame -->
    <rect x="0" y="0" width="760" height="540" rx="16" fill="#0F172A" stroke="#475569" stroke-width="4" filter="url(#solarGlow)" />

    <!-- 6x4 Monocrystalline Solar Cells Grid -->
    <g transform="translate(20, 20)">
      <!-- 24 Photovoltaic Cells -->
      <g stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5">
        <!-- Row 0 -->
        <rect x="0" y="0" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="120" y="0" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="240" y="0" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="360" y="0" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="480" y="0" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="600" y="0" width="112" height="115" rx="4" fill="url(#pvCell)" />

        <!-- Row 1 -->
        <rect x="0" y="125" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="120" y="125" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="240" y="125" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="360" y="125" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="480" y="125" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="600" y="125" width="112" height="115" rx="4" fill="url(#pvCell)" />

        <!-- Row 2 -->
        <rect x="0" y="250" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="120" y="250" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="240" y="250" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="360" y="250" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="480" y="250" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="600" y="250" width="112" height="115" rx="4" fill="url(#pvCell)" />

        <!-- Row 3 -->
        <rect x="0" y="375" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="120" y="375" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="240" y="375" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="360" y="375" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="480" y="375" width="112" height="115" rx="4" fill="url(#pvCell)" />
        <rect x="600" y="375" width="112" height="115" rx="4" fill="url(#pvCell)" />
      </g>

      <!-- Silver Busbar Conductors Across Cells -->
      <g stroke="#94A3B8" stroke-width="2" opacity="0.7">
        <line x1="37" y1="0" x2="37" y2="490" />
        <line x1="75" y1="0" x2="75" y2="490" />
        <line x1="157" y1="0" x2="157" y2="490" />
        <line x1="195" y1="0" x2="195" y2="490" />
        <line x1="277" y1="0" x2="277" y2="490" />
        <line x1="315" y1="0" x2="315" y2="490" />
        <line x1="397" y1="0" x2="397" y2="490" />
        <line x1="435" y1="0" x2="435" y2="490" />
        <line x1="517" y1="0" x2="517" y2="490" />
        <line x1="555" y1="0" x2="555" y2="490" />
        <line x1="637" y1="0" x2="637" y2="490" />
        <line x1="675" y1="0" x2="675" y2="490" />
      </g>
    </g>

    <!-- PV Panel Specs Label -->
    <text x="380" y="525" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">MONOCRYSTALLINE PV ARRAY · 18V 35W PEAK EFFICIENCY: 22.4%</text>
  </g>

  <!-- ============================================ -->
  <!-- 2. RIGHT: HIGH EFFICIENCY MPPT BUCK CONVERTER-->
  <!-- ============================================ -->
  <g transform="translate(1100, 260)">
    <!-- Transparent Protective Acrylic Case -->
    <rect x="0" y="0" width="620" height="540" rx="20" fill="#0A0E17" stroke="#38BDF8" stroke-width="2.5" filter="url(#solarGlow)" />
    
    <!-- Heavy Duty PCB Substrate (Matte Black) -->
    <rect x="20" y="20" width="580" height="500" rx="14" fill="#05080E" stroke="#1E293B" stroke-width="1.5" />

    <!-- Copper Traces on PCB -->
    <path d="M 50,220 L 140,220 L 180,180 L 260,180" stroke="#F59E0B" stroke-width="3" fill="none" opacity="0.6" />
    <path d="M 50,260 L 140,260 L 180,300 L 260,300" stroke="#F59E0B" stroke-width="3" fill="none" opacity="0.6" />

    <!-- Heavy Toroidal Inductor Coil with Copper Windings -->
    <g transform="translate(180, 150)">
      <circle cx="0" cy="0" r="55" fill="#1E293B" stroke="#475569" stroke-width="3" />
      <circle cx="0" cy="0" r="28" fill="#05080E" />
      <!-- Copper Wire Coils wrapping around torus -->
      <g stroke="url(#copper)" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-55" x2="0" y2="-28" />
        <line x1="28" y1="-48" x2="14" y2="-24" />
        <line x1="48" y1="-28" x2="24" y2="-14" />
        <line x1="55" y1="0" x2="28" y2="0" />
        <line x1="48" y1="28" x2="24" y2="14" />
        <line x1="28" y1="48" x2="14" y2="24" />
        <line x1="0" y1="55" x2="0" y2="28" />
        <line x1="-28" y1="48" x2="-14" y2="24" />
        <line x1="-48" y1="28" x2="-24" y2="14" />
        <line x1="-55" y1="0" x2="-28" y2="0" />
        <line x1="-48" y1="-28" x2="-24" y2="-14" />
        <line x1="-28" y1="-48" x2="-14" y2="-24" />
      </g>
      <text x="0" y="80" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">33uH MPPT TOROID</text>
    </g>

    <!-- Solid Electrolytic Filter Capacitors -->
    <g transform="translate(320, 150)">
      <circle cx="-35" cy="0" r="30" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <line x1="-65" y1="0" x2="-5" y2="0" stroke="#38BDF8" stroke-width="3" />
      <circle cx="35" cy="0" r="30" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <line x1="5" y1="0" x2="65" y2="0" stroke="#38BDF8" stroke-width="3" />
      <text x="0" y="55" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">2x 1000uF 35V LOW-ESR</text>
    </g>

    <!-- Digital OLED / 7-Segment Real-time Output Readout -->
    <g transform="translate(180, 270)">
      <rect x="0" y="0" width="280" height="110" rx="10" fill="#000000" stroke="#FF1F1F" stroke-width="2" filter="url(#solarGlow)" />
      <text x="14" y="32" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">REGULATED DC OUTPUT</text>
      <!-- Large Digital Numbers -->
      <text x="14" y="80" fill="#FFFFFF" font-family="'Anton', sans-serif" font-size="44" letter-spacing="2">5.02V</text>
      <text x="160" y="80" fill="#38BDF8" font-family="'Anton', sans-serif" font-size="44" letter-spacing="2">2.40A</text>
      <text x="14" y="100" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">MPPT EFFICIENCY: 94.6% · 12.05W</text>
    </g>

    <!-- Dual USB-C Fast Charging Ports & LED Indicator -->
    <g transform="translate(480, 270)">
      <!-- Port 1 -->
      <rect x="0" y="10" width="80" height="34" rx="12" fill="#0A0E17" stroke="#38BDF8" stroke-width="2" />
      <rect x="18" y="24" width="44" height="6" rx="2" fill="#38BDF8" />
      <text x="40" y="58" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">USB-C 01</text>

      <!-- Port 2 -->
      <rect x="0" y="70" width="80" height="34" rx="12" fill="#0A0E17" stroke="#FF1F1F" stroke-width="2" />
      <rect x="18" y="84" width="44" height="6" rx="2" fill="#FF1F1F" />
      <text x="40" y="118" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">QC 3.0</text>
    </g>

    <!-- Active Red Charging LED Indicator -->
    <circle cx="530" cy="80" r="8" fill="#FF1F1F" filter="url(#solarGlow)" />
    <circle cx="530" cy="80" r="3" fill="#FFFFFF" />
    <text x="530" y="110" text-anchor="middle" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">CHARGING</text>

    <!-- Bottom Specs Card inside Acrylic -->
    <rect x="40" y="420" width="540" height="70" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="60" y="445" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">PROTECTION: OVER-VOLTAGE / SHORT-CIRCUIT CUTOFF</text>
    <text x="60" y="468" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">REVERSE CURRENT DIODE PROTECTION · EMBEDDED THERMAL SHUTDOWN</text>
  </g>

  <!-- Top Watermark -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="4">SACHIN J // PROJECT 08</text>
    <text x="0" y="32" fill="#FFFFFF" font-family="'Anton', sans-serif" font-size="36" letter-spacing="2">SOLAR-POWERED MOBILE CHARGER</text>
    <text x="0" y="58" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">MONOCRYSTALLINE PV · HIGH-EFFICIENCY MPPT BUCK REGULATION · DUAL USB-C FAST CHARGING</text>
  </g>
</svg>
