<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="armBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="60%" stop-color="#090C14" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <filter id="segmentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="mcuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="icEpoxy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#armBg)" />

  <!-- Breadboard Pattern Base -->
  <g transform="translate(140, 200)">
    <!-- White Solderless Breadboard Body -->
    <rect x="0" y="0" width="1640" height="660" rx="20" fill="#1A2234" stroke="#334155" stroke-width="3" />
    <rect x="15" y="15" width="1610" height="630" rx="12" fill="#0D1322" />

    <!-- Power Rails (+ and -) -->
    <line x1="40" y1="40" x2="1600" y2="40" stroke="#EF4444" stroke-width="3" opacity="0.8" />
    <line x1="40" y1="60" x2="1600" y2="60" stroke="#3B82F6" stroke-width="3" opacity="0.8" />
    <line x1="40" y1="600" x2="1600" y2="600" stroke="#EF4444" stroke-width="3" opacity="0.8" />
    <line x1="40" y1="620" x2="1600" y2="620" stroke="#3B82F6" stroke-width="3" opacity="0.8" />

    <!-- Breadboard Pin Holes Matrix (Sample Grid) -->
    <g fill="#070A12">
      <!-- Top Rail Holes -->
      <circle cx="100" cy="40" r="3" /><circle cx="140" cy="40" r="3" /><circle cx="180" cy="40" r="3" />
      <circle cx="220" cy="40" r="3" /><circle cx="260" cy="40" r="3" /><circle cx="300" cy="40" r="3" />
      <circle cx="100" cy="60" r="3" /><circle cx="140" cy="60" r="3" /><circle cx="180" cy="60" r="3" />
      <circle cx="220" cy="60" r="3" /><circle cx="260" cy="60" r="3" /><circle cx="300" cy="60" r="3" />
    </g>

    <!-- ============================================ -->
    <!-- 1. LEFT: 32-BIT ARM7 LPC2148 MICROCONTROLLER -->
    <!-- ============================================ -->
    <g transform="translate(320, 320)">
      <!-- Dev Board PCB -->
      <rect x="-190" y="-190" width="380" height="380" rx="18" fill="#064E3B" stroke="#10B981" stroke-width="3" />
      <rect x="-175" y="-175" width="350" height="350" rx="12" fill="#04382A" />

      <!-- Golden Headers on 4 sides of MCU -->
      <g fill="#F59E0B">
        <rect x="-160" y="-170" width="320" height="14" rx="2" />
        <rect x="-160" y="156" width="320" height="14" rx="2" />
        <rect x="-170" y="-160" width="14" height="320" rx="2" />
        <rect x="156" y="-160" width="14" height="320" rx="2" />
      </g>

      <!-- Center LPC2148 LQFP-64 IC Body -->
      <rect x="-85" y="-85" width="170" height="170" rx="6" fill="url(#icEpoxy)" stroke="#64748B" stroke-width="2" filter="url(#mcuGlow)" />
      <!-- Orientation Notch -->
      <circle cx="-65" cy="-65" r="7" fill="#0F172A" stroke="#475569" stroke-width="1.5" />

      <!-- Chip Silkscreen Markings -->
      <text x="0" y="-30" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">ARM</text>
      <text x="0" y="-8" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">LPC2148</text>
      <text x="0" y="14" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">FBD64</text>
      <text x="0" y="36" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">NXP SEMICONDUCTORS</text>
      <text x="0" y="54" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">32-BIT ARM7TDMI-S</text>

      <!-- 32.768 kHz RTC Quartz Crystal (Silver Cylinder) -->
      <g transform="translate(110, -110)">
        <rect x="-10" y="-22" width="20" height="44" rx="10" fill="url(#crystal)" stroke="#94A3B8" stroke-width="1.5" filter="url(#mcuGlow)" />
        <line x1="-5" y1="22" x2="-5" y2="40" stroke="#E2E8F0" stroke-width="2" />
        <line x1="5" y1="22" x2="5" y2="40" stroke="#E2E8F0" stroke-width="2" />
        <text x="0" y="-30" text-anchor="middle" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">32.768 kHz RTC</text>
      </g>
    </g>

    <!-- Multi-Colored Jumper Wires Crossing Over to Display -->
    <g fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M 500,240 Q 640,160 820,240" stroke="#FF1F1F" />
      <path d="M 500,260 Q 660,190 820,260" stroke="#3B82F6" />
      <path d="M 500,280 Q 680,220 820,280" stroke="#10B981" />
      <path d="M 500,300 Q 700,250 820,300" stroke="#F59E0B" />
      <path d="M 500,320 Q 720,280 820,320" stroke="#8B5CF6" />
      <path d="M 500,340 Q 740,310 820,340" stroke="#EC4899" />
      <path d="M 500,360 Q 760,340 820,360" stroke="#06B6D4" />
      <path d="M 500,380 Q 780,370 820,380" stroke="#E2E8F0" />
    </g>

    <!-- ================================================= -->
    <!-- 2. RIGHT: GLOWING 4-DIGIT 7-SEGMENT DIGITAL CLOCK -->
    <!-- ================================================= -->
    <g transform="translate(860, 180)">
      <!-- Display Bezel Module -->
      <rect x="0" y="0" width="700" height="280" rx="18" fill="#000000" stroke="#FF1F1F" stroke-width="3" filter="url(#segmentGlow)" />
      
      <!-- Digit 1: "1" -->
      <g transform="translate(70, 50)" fill="#FF1F1F" filter="url(#segmentGlow)">
        <rect x="70" y="10" width="16" height="70" rx="4" />
        <rect x="70" y="95" width="16" height="70" rx="4" />
      </g>

      <!-- Digit 2: "2" -->
      <g transform="translate(190, 50)" fill="#FF1F1F" filter="url(#segmentGlow)">
        <rect x="10" y="0" width="75" height="16" rx="4" />
        <rect x="75" y="10" width="16" height="70" rx="4" />
        <rect x="10" y="80" width="75" height="16" rx="4" />
        <rect x="0" y="95" width="16" height="70" rx="4" />
        <rect x="10" y="160" width="75" height="16" rx="4" />
      </g>

      <!-- Flashing Colon Dots -->
      <g transform="translate(325, 100)" fill="#FF1F1F" filter="url(#segmentGlow)">
        <circle cx="0" cy="15" r="10" />
        <circle cx="0" cy="65" r="10" />
      </g>

      <!-- Digit 3: "4" -->
      <g transform="translate(370, 50)" fill="#FF1F1F" filter="url(#segmentGlow)">
        <rect x="0" y="10" width="16" height="70" rx="4" />
        <rect x="10" y="80" width="75" height="16" rx="4" />
        <rect x="75" y="10" width="16" height="70" rx="4" />
        <rect x="75" y="95" width="16" height="70" rx="4" />
      </g>

      <!-- Digit 4: "5" -->
      <g transform="translate(490, 50)" fill="#FF1F1F" filter="url(#segmentGlow)">
        <rect x="10" y="0" width="75" height="16" rx="4" />
        <rect x="0" y="10" width="16" height="70" rx="4" />
        <rect x="10" y="80" width="75" height="16" rx="4" />
        <rect x="75" y="95" width="16" height="70" rx="4" />
        <rect x="10" y="160" width="75" height="16" rx="4" />
      </g>

      <!-- Seconds indicator :30 -->
      <g transform="translate(620, 110)">
        <text x="0" y="40" fill="#38BDF8" font-family="'Anton', sans-serif" font-size="44" letter-spacing="2">30</text>
        <text x="0" y="70" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">SEC</text>
      </g>

      <!-- Module Subtitle -->
      <text x="350" y="260" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">MULTIPLEXED 4-DIGIT COMMON CATHODE 7-SEGMENT DISPLAY</text>
    </g>

    <!-- Keil uVision RTC Register Configuration Banner -->
    <g transform="translate(860, 490)">
      <rect x="0" y="0" width="700" height="120" rx="12" fill="#04060A" stroke="#21262D" stroke-width="1.5" />
      <text x="24" y="32" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">KEIL uVISION // ON-CHIP RTC REGISTER DUMP</text>
      <text x="24" y="60" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">CCR = 0x01; // Enable Real-Time Clock Core</text>
      <text x="24" y="80" fill="#A0AEC0" font-family="'JetBrains Mono', monospace" font-size="11">SEC = 30; MIN = 45; HOUR = 12; // Time Synchronization</text>
      <text x="24" y="102" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">STATUS: RTC PRESCALER CALIBRATED (32.768 kHz CRYSTAL LOCK)</text>
    </g>
  </g>

  <!-- Top Watermark -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#FF1F1F" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="4">SACHIN J // PROJECT 09</text>
    <text x="0" y="32" fill="#FFFFFF" font-family="'Anton', sans-serif" font-size="36" letter-spacing="2">DIGITAL CLOCK USING ARM LPC2148</text>
    <text x="0" y="58" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">32-BIT ARM7TDMI-S · ON-CHIP RTC REGISTERS · 32.768 kHz CRYSTAL · MULTIPLEXED 7-SEGMENT DISPLAY</text>
  </g>
</svg>
